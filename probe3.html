      var box = document.getElementById('log');
      var lines = [];

      function log(text) {
        lines.push(text);
        box.textContent = lines.join('\n');
      }

      function describe(error) {
        if (!error) {
          return '未知错误';
        }
        var parts = [];
        if (error.code) { parts.push('code=' + error.code); }
        if (error.message) { parts.push('message=' + error.message); }
        if (error.details) { parts.push('details=' + JSON.stringify(error.details)); }
        return parts.length ? parts.join(' | ') : JSON.stringify(error).slice(0, 300);
      }

      async function run() {
        log('环境：' + ENV);
        if (!window.cloudbase) {
          log('❌ SDK 未加载');
          return;
        }
        log('✅ SDK 已加载 ' + (cloudbase.SDK_VERSION || ''));

        var app;
        try {
          app = cloudbase.init({ env: ENV, region: REGION, accessKey: KEY });
          log('✅ init 成功');
        } catch (error) {
          log('❌ init 失败：' + describe(error));
          return;
        }

        if (typeof app.rdb !== 'function') {
          log('❌ app.rdb 不存在 —— SDK 版本太旧，不支持 PG 模式');
        } else {
          log('✅ app.rdb 可用');
          var db;
          try {
            db = app.rdb();
          } catch (error) {
            log('❌ app.rdb() 调用失败：' + describe(error));
          }

          if (db) {
            try {
              var read = await db.from('qingyou_progress').select('code').limit(1);
              log('✅ 读取成功：data=' + JSON.stringify(read.data).slice(0, 160) +
                ' error=' + describe(read.error && read.error.message ? read.error : null));
            } catch (error) {
              log('❌ 读取异常：' + describe(error));
            }

            try {
              var write = await db.from('qingyou_probe_pg')
                .insert({ note: 'probe', at: new Date().toISOString() });
              log('写入 qingyou_probe_pg：data=' + JSON.stringify(write.data).slice(0, 160) +
                ' error=' + describe(write.error && write.error.message ? write.error : null));
            } catch (error) {
              log('写入异常：' + describe(error));
            }
          }
        }

        log('');
        log('—— 诊断结束，请截图 ——');
      }

      run();
    })();
