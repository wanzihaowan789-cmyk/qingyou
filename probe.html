      var box = document.getElementById('log');
      var lines = [];

      function log(text, kind) {
        lines.push(text);
        box.textContent = lines.join('\n');
        if (kind === 'ok') {
          box.innerHTML = lines.map(function (one) {
            return one === text ? '<span class="ok">' + one + '</span>' : one;
          }).join('\n');
        }
      }

      function describe(error) {
        if (!error) {
          return '未知错误';
        }
        return (error.code || 'NO_CODE') + ' | ' + (error.message || String(error));
      }

      async function run() {
        if (!window.cloudbase) {
          log('❌ SDK 没有加载成功，检查网络能否访问 static.cloudbase.net', 'bad');
          return;
        }
        log('✅ SDK 已加载，版本：' + (cloudbase.SDK_VERSION || '未知'));

        var app;
        try {
          app = cloudbase.init({ env: ENV, region: REGION, accessKey: KEY });
          log('✅ init 成功');
        } catch (error) {
          log('❌ init 失败：' + describe(error), 'bad');
          return;
        }

        try {
          var auth = app.auth();
          var info = await auth.getUserInfo();
          log('✅ 鉴权成功，用户类型：' + (info && (info.uid || info.name) || 'anonymous'));
        } catch (error) {
          log('⚠️ 鉴权查询失败：' + describe(error));
        }

        var db;
        try {
          db = app.database();
          log('✅ database() 可用');
        } catch (error) {
          log('❌ database() 不可用：' + describe(error), 'bad');
          return;
        }

        try {
          var read = await db.collection('qingyou_progress').limit(1).get();
          log('✅ 读取 qingyou_progress 成功，返回：' + JSON.stringify(read).slice(0, 200));
        } catch (error) {
          log('❌ 读取失败：' + describe(error), 'bad');
        }

        try {
          var write = await db.collection('qingyou_probe').add({ t: Date.now(), from: 'probe' });
          log('✅ 写入 qingyou_probe 成功，id：' + JSON.stringify(write).slice(0, 160));
        } catch (error) {
          log('❌ 写入失败：' + describe(error), 'bad');
        }

        log('—— 诊断结束，请截图 ——');
      }

      run();
    })();
