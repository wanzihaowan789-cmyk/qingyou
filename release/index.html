<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="青柚学伴：先补概念洞，再按遗忘曲线复习。">
  <meta name="qy-build" content="20261116-2344">
  <title>青柚学伴</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=20261116-2344">
  <link rel="preload" href="data.core.js?v=20261116-2344" as="script">

</head>
<body>
  <noscript>
    <p class="boot-error">这个页面需要开启 JavaScript 才能使用。</p>
  </noscript>

  <header class="app-header">
    <h1 class="brand">青柚学伴</h1>
    <p class="subtitle">先补概念洞，再按遗忘曲线复习</p>
    <nav class="tabs" role="tablist" aria-label="主视图切换">
      <button class="tab is-active" type="button" role="tab" id="tab-today"
        aria-selected="true" aria-controls="view-today" data-view="today">今日</button>
      <button class="tab" type="button" role="tab" id="tab-cards"
        aria-selected="false" aria-controls="view-cards" data-view="cards">概念卡</button>
      <button class="tab" type="button" role="tab" id="tab-board"
        aria-selected="false" aria-controls="view-board" data-view="board">错题台</button>
      <button class="tab" type="button" role="tab" id="tab-profile"
        aria-selected="false" aria-controls="view-profile" data-view="profile">画像</button>
    </nav>
  </header>

  <main id="app" class="app-main">
    <div id="view-code-bar" class="view-code-bar" hidden>
      <p class="view-code-text">查看他人进度：输入对方的档案码</p>
      <div class="view-code-row">
        <input id="view-code-input" class="sync-code" type="text" inputmode="latin"
          autocomplete="off" spellcheck="false" maxlength="16" placeholder="例如 QY-3K9M2">
        <button id="view-code-go" class="btn btn-small" type="button">查看</button>
      </div>
    </div>
    <p id="cards-notice" class="notice" role="status" hidden></p>
    <section class="view is-active" id="view-today" data-view="today" aria-labelledby="tab-today">
      <div id="today-content"></div>
    </section>
    <section class="view" id="view-cards" data-view="cards" aria-labelledby="tab-cards">
      <div id="cards-guide" class="guide" hidden></div>
      <div id="card-list"></div>
    </section>
    <section class="view" id="view-board" data-view="board" aria-labelledby="tab-board">
      <div id="board-content"></div>
    </section>
    <section class="view" id="view-profile" data-view="profile" aria-labelledby="tab-profile">
      <div id="profile-content"></div>
    </section>
  </main>

  <section class="settings" aria-labelledby="settings-title">
    <div class="settings-card">
      <h2 id="settings-title" class="settings-title">数据</h2>
      <div class="settings-actions">
        <button id="export-btn" class="btn btn-ghost btn-small" type="button">导出当前档案</button>
        <button id="import-btn" class="btn btn-ghost btn-small" type="button">导入到当前档案</button>
        <button id="import-bank-btn" class="btn btn-ghost btn-small" type="button">导入题库</button>
        <button id="seed-btn" class="btn btn-ghost btn-small" type="button">加载示例数据</button>
      </div>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <input id="import-bank-file" type="file" accept=".json,application/json" hidden>
    </div>

    <div class="settings-card" id="report-card">
      <h2 class="settings-title">学习报告</h2>
      <p class="settings-note">生成文字报告，微信转发给家长。</p>
      <button id="report-btn" class="btn btn-small" type="button">生成学习报告</button>
    </div>

    <div class="settings-card" id="sync-card" hidden>
      <h2 id="sync-title" class="settings-title">多端同步</h2>
      <p class="settings-note" id="sync-note">
        同一同步码即可共用进度。
      </p>
      <div class="sync-row">
        <label class="sync-label" for="sync-code">同步码</label>
        <input id="sync-code" class="sync-code" type="text" inputmode="latin" autocomplete="off"
          spellcheck="false" maxlength="16" placeholder="例如 QY7K2M9P">
        <button id="sync-gen" class="btn btn-ghost btn-small" type="button">生成</button>
        <button id="sync-go" class="btn btn-small" type="button">连接</button>
      </div>
      <div class="sync-row sync-row-sub">
        <label class="sync-toggle">
          <input id="sync-readonly" type="checkbox">
          <span>只读模式（只查看，不回写数据）</span>
        </label>
        <button id="sync-now" class="btn btn-ghost btn-small" type="button">立即同步</button>
      </div>
      <p class="sync-status" id="sync-status" role="status" aria-live="polite">未连接</p>
    </div>
  </section>

  <footer class="app-footer">
    <p>青柚学伴 · 高一数学诊断与复习</p>
    <p class="privacy">数据存在本机，并自动同步到云端。</p>
    <p class="build-tag" id="build-tag">版本 dev</p>
  </footer>

  <div id="quiz-modal" class="quiz-modal" hidden>
    <div class="quiz-panel" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
      <div class="quiz-head">
        <div>
          <p id="quiz-title" class="quiz-title"></p>
          <p id="quiz-progress" class="quiz-progress"></p>
        </div>
        <button id="quiz-close" class="quiz-close" type="button" aria-label="关闭答题">×</button>
      </div>
      <div id="quiz-body" class="quiz-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="report-modal" class="quiz-modal" hidden>
    <div class="quiz-panel report-panel" role="dialog" aria-modal="true" aria-labelledby="report-title">
      <div class="quiz-head">
        <p id="report-title" class="quiz-title">学习报告</p>
        <button id="report-close" class="quiz-close" type="button" aria-label="关闭报告">×</button>
      </div>
      <div class="quiz-body">
        <pre id="report-text" class="report-text"></pre>
        <div class="report-actions">
          <button id="report-copy" class="btn btn-small" type="button">复制文字</button>
          <button id="report-share" class="btn btn-ghost btn-small" type="button">分享</button>
        </div>
        <p class="report-hint">复制后粘贴到微信，或点「分享」直接发给家长。</p>
      </div>
    </div>
  </div>

  <script src="data.core.js?v=20261116-2344"></script>
  <script src="app.js?v=20261116-2344"></script>
  <script>
    window.addEventListener('load', function () {
      if (window.__QY_APP_LOADED) {
        return;
      }
      var box = document.createElement('div');
      box.className = 'boot-error';
      box.setAttribute('role', 'alert');

      var title = document.createElement('p');
      title.className = 'boot-error-title';
      title.textContent = '页面脚本没有加载成功';

      var text = document.createElement('p');
      text.className = 'boot-error-text';
      text.textContent = '请确认 style.css、app.js、data.core.js 与 index.html 在同一个文件夹里；如果只拿到了一个文件，请改用 qingyou-standalone.html。';

      box.appendChild(title);
      box.appendChild(text);
      document.body.insertBefore(box, document.body.firstChild);
    });
  </script>

  <script>
    /* 生成题在首屏渲染完成后再加载，避免拖慢打开速度 */
    window.addEventListener('load', function () {
      var script = document.createElement('script');
      script.src = 'data.bulk.js?v=20261116-2344';
      script.async = true;
      script.onload = function () {
        if (window.QY_ABSORB_BULK) {
          window.QY_ABSORB_BULK();
        }
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
